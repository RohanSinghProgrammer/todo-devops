name: CD - Deploy to Lightsail

on:
  workflow_run:
    workflows: ["CI - Build and Push to ECR"]
    branches: ["main"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Blue-Green Deployment with Automated Rollback
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: todo-app
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}
        run: |
          chmod +x ./todo-app/scripts/deploy-blue-green.sh
          ./todo-app/scripts/deploy-blue-green.sh
