server {
    # Listen on port 80 (HTTP)
    listen 80;
    listen [::]:80;
    
    # The subdomain you want to use
    server_name todo.utilsfirst.com;

    # Log files for debugging and analytics
    access_log /var/log/nginx/todo-app.access.log;
    error_log /var/log/nginx/todo-app.error.log;

    location / {
        # Forward requests to your running container. 
        # Make sure this port matches the host port you publish via podman/docker (e.g., -p 3000:8080)
        proxy_pass http://127.0.0.1:3000;
        
        # Preserve client information headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: WebSocket support (useful if you ever run the dev server behind the proxy)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
