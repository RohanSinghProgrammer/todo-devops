name: CD - Deploy to Lightsail

on:
  workflow_run:
    workflows: ["CI - Build and Push to ECR"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate ECR Login Password
        id: ecr-password
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})" >> $GITHUB_OUTPUT
          
      - name: Get ECR Registry URL
        id: ecr-url
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "url=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@master
        env:
          ECR_URL: ${{ steps.ecr-url.outputs.url }}
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: ECR_URL,ECR_PASSWORD
          script: |
            # Login to ECR using the short-lived token generated by OIDC
            echo $ECR_PASSWORD | docker login --username AWS --password-stdin $ECR_URL
            
            # Pull the latest image
            docker pull $ECR_URL/todo-app:latest
            
            # Stop and remove existing container if it exists
            docker stop todo-app || true
            docker rm todo-app || true
            
            # Run the new container
            docker run -d --name todo-app -p 80:8080 --restart unless-stopped $ECR_URL/todo-app:latest
            
            # Logout to be secure
            docker logout $ECR_URL
